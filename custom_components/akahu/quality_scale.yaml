rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide additional actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The Akahu API client is currently embedded in this integration. Before submitting upstream, extract it to a dedicated PyPI library (e.g. `pyakahu`) and add it to `requirements`.
  docs-actions:
    status: exempt
    comment: This integration does not provide additional actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not explicitly subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No custom actions are defined.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options to configure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: This is a cloud service; no discovery exists.
  discovery:
    status: exempt
    comment: This is a cloud service; no discovery exists.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: Balance sensors are primary entities, not diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All entities should be enabled by default.
  entity-translations:
    status: exempt
    comment: Entity names mirror the user's bank account names, which come from the API.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Uses the monetary device class default icon.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repair issues to raise.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
